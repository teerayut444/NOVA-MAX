[server]
# Don't auto-reload all connected users when a source file is touched on the host
runOnSave = false
fileWatcherType = "none"
maxUploadSize = 200
maxMessageSize = 250
enableStaticServing = true

[client]
# Use "viewer" (not "minimal") so stStatusWidget ("Running...") stays rendered even when
# hostToolbarItems is empty (e.g. under ?embed=true&embed_options=show_toolbar);
# Share / Star / Edit / GitHub / Deploy / Main Menu are hidden via CSS in app.py.
toolbarMode = "viewer"

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#047857"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f8f6"
textColor = "#0f172a"

